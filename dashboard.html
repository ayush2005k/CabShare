<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CabShare</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-canvas min-h-screen flex flex-col lg:flex-row">
    <!-- Sidebar -->
    <aside class="sidebar lg:w-[260px] w-full shrink-0">
        <div class="flex items-center gap-2 mb-12">
            <div class="logo-box flex items-center justify-center">
                <i data-lucide="car-front" class="text-black w-5 h-5"></i>
            </div>
            <span class="text-xl font-black italic tracking-tighter">POOL.IT</span>
        </div>

        <nav class="space-y-1">
            <a href="/dashboard.html" class="nav-item active">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                Dashboard
            </a>
            <div id="roleNav" class="space-y-1">
                <!-- Dynamic Navigation -->
            </div>
            <a href="#" class="nav-item">
                <i data-lucide="user" class="w-4 h-4"></i>
                Profile
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="settings" class="w-4 h-4"></i>
                Settings
            </a>
        </nav>

        <button id="logoutBtn" class="nav-item mt-auto text-red-400 hover:text-red-500 hover:bg-red-500/10">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Logout
        </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <div>
                <h1 class="text-3xl font-black tracking-tight" id="welcomeMsg">Welcome back!</h1>
                <p class="text-text-dim mt-1" id="subMsg">Where are you heading today?</p>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="bg-accent/10 text-accent-dark text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded hidden sm:block">Demo Mode</div>
                <div id="actionContainer">
                    <!-- Action Button -->
                </div>
                <div class="flex items-center gap-3 pl-6 border-l border-border">
                    <div class="text-right hidden sm:block">
                        <p id="userName" class="text-sm font-bold leading-none"></p>
                        <p id="userRole" class="text-[10px] font-black uppercase text-text-dim mt-1 tracking-widest"></p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-border flex items-center justify-center overflow-hidden">
                        <img src="https://i.pravatar.cc/100?u=current" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid sm:grid-cols-3 gap-6 mb-12 animate-fade-in">
            <div class="stat-card card">
                <div class="stat-label">Total Rides</div>
                <div class="stat-value">12</div>
            </div>
            <div class="stat-card card">
                <div class="stat-label">Saved Carbon</div>
                <div class="stat-value">45 kg</div>
            </div>
            <div class="stat-card card text-green-600">
                <div class="stat-label">Saved Money</div>
                <div class="stat-value">$120</div>
            </div>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold">Upcoming Journeys</h2>
            <button class="text-sm font-bold text-text-dim hover:text-black transition-colors">Refresh</button>
        </div>

        <!-- Dynamic List -->
        <div id="contentSection" class="space-y-4">
            <!-- Dynamic Content -->
            <div class="flex flex-col items-center justify-center py-20 text-center animate-fade-in">
                <div class="w-12 h-12 bg-white rounded-full border border-border flex items-center justify-center mb-4">
                    <div class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                </div>
                <h3 class="font-bold text-text-dim">Loading departures...</h3>
            </div>
        </div>
    </main>

    <script type="module">
        import { utils } from '/js/utils.js';
        
        
        utils.requireAuth();
        lucide.createIcons();

        const user = utils.getUser();
        const userNameEl = document.getElementById('userName');
        const userRoleEl = document.getElementById('userRole');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const subMsg = document.getElementById('subMsg');
        const roleNav = document.getElementById('roleNav');
        const actionContainer = document.getElementById('actionContainer');
        const contentSection = document.getElementById('contentSection');

        if (user) {
            userNameEl.innerText = user.name;
            userRoleEl.innerText = user.role;
            welcomeMsg.innerText = `Good day, ${user.name.split(' ')[0]}`;
            
            if (user.role === 'Driver') {
                subMsg.innerText = "You have 3 active pools for today.";
                roleNav.innerHTML = `
                    <a href="/create-ride.html" class="nav-item">
                        <i data-lucide="plus-square" class="w-4 h-4"></i>
                        Post a Ride
                    </a>
                `;
                actionContainer.innerHTML = `
                    <a href="/create-ride.html" class="btn btn-primary px-6 py-3">
                        + Create Ride
                    </a>
                `;
                loadDriverRides();
            } else {
                subMsg.innerText = "Discover community rides nearby.";
                roleNav.innerHTML = `
                    <a href="/join-ride.html" class="nav-item">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        Find a Ride
                    </a>
                    <a href="/create-ride.html" class="nav-item">
                        <i data-lucide="message-square-plus" class="w-4 h-4"></i>
                        Request a Ride
                    </a>
                `;
                actionContainer.innerHTML = `
                    <div class="flex gap-2">
                        <a href="/create-ride.html" class="btn btn-outline px-6 py-3 text-sm">
                            Request Ride
                        </a>
                        <a href="/join-ride.html" class="btn btn-accent px-6 py-3">
                            Find a Ride
                        </a>
                    </div>
                `;
                loadAvailableRides();
            }
            lucide.createIcons();
        }

        async function loadAvailableRides() {

            try {


        const response = await fetch(
            "http://127.0.0.1:8000/api/rides/"
        );

        const ridesData =
            await response.json();

        console.log(ridesData);

        renderRides(
            ridesData,
            'Rider'
        );

    } catch (error) {

        console.log(error);

        contentSection.innerHTML = `
            <div class="card p-12 text-center">
                <p class="text-red-500 font-bold">
                    Failed to load rides
                </p>
            </div>
        `;
    }

        }

        async function loadDriverRides() {
            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/api/rides/"
                );
                const ridesData = await response.json();
                console.log(ridesData);
                renderRides(ridesData, 'Driver');
            } catch (error) {
                console.log(error);
                contentSection.innerHTML = `
                    <div class="card p-12 text-center">
                        <p class="text-red-500 font-bold">
                            Failed to load your rides
                        </p>
                    </div>
                `;
            }
        }
        

        function renderRides(rideList, role) {
            if (!rideList || rideList.length === 0) {
                contentSection.innerHTML = `
                    <div class="card p-12 text-center">
                        <p class="text-text-dim font-medium">No available rides at the moment.</p>
                    </div>
                `;
                return;
            }

            contentSection.innerHTML = rideList.map(ride => `
                <div class="card p-5 flex items-center justify-between gap-6 hover:border-black transition-all group">
                    <div class="flex items-center gap-5 flex-1">
                        <div class="w-12 h-12 bg-accent/20 rounded-xl flex items-center justify-center text-xl grayscale group-hover:grayscale-0 transition-all">
                            🚗
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-1">
                                <span class="font-bold text-[15px] uppercase tracking-tight">${ride.start_location}</span>
                                <i data-lucide="arrow-right" class="w-3 h-3 text-text-dim"></i>
                                <span class="font-bold text-[15px] uppercase tracking-tight">${ride.end_location}</span>
                            </div>
                            <div class="text-[13px] text-text-dim">
                                Departs ${ride.time || '09:15 AM'} • ${ride.seats} seats available
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <span class="font-bold">$${(Math.random() * 10 + 2).toFixed(2)}</span>
                        ${role === 'Rider' ? `
                            <button onclick="handleJoin('${ride.id}')" class="btn btn-primary py-2 px-4 text-xs">Join</button>
                        ` : `
                            <button class="btn btn-outline py-2 px-4 text-xs">Edit</button>
                        `}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.handleJoin = async (id) => {
            const success = await rides.join(id);
            if (success) {
                utils.showToast("Ride joined!");
                loadAvailableRides();
            }
        };

        document.getElementById('logoutBtn').addEventListener('click', () => {
            utils.logout();
        });
    </script>
</body>
</html>
