<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Rides | CabShare</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-canvas min-h-screen">
    <!-- Navbar -->
    <nav class="glass border-b border-border sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="logo-box flex items-center justify-center">
                    <i data-lucide="car-front" class="text-black w-5 h-5"></i>
                </div>
                <span class="text-xl font-black italic tracking-tighter">POOL.IT</span>
            </div>
            <a href="/dashboard.html" class="p-2 hover:bg-white rounded-full transition-colors">
                <i data-lucide="x" class="w-6 h-6 text-text-dim"></i>
            </a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-12">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <h1 class="text-4xl font-black tracking-tight">Discover Pools</h1>
            <div class="flex items-center gap-4 bg-white px-4 py-2 rounded-2xl shadow-sm border border-border group focus-within:border-black transition-colors">
                <i data-lucide="search" class="w-4 h-4 text-text-dim"></i>
                <input type="text" id="searchInput" placeholder="Search destination..." class="border-none bg-transparent focus:ring-0 py-2 text-sm w-64">
            </div>
        </div>

        <div id="ridesList" class="space-y-4">
            <!-- Rides will be injected here -->
            <div class="flex justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-dark"></div>
            </div>
        </div>

        <!-- Request Ride CTA -->
        <div class="mt-12 card p-8 bg-black text-white flex flex-col md:flex-row items-center justify-between gap-6 animate-fade-in">
            <div>
                <h3 class="text-xl font-bold mb-1">Can't find your destination?</h3>
                <p class="text-white/60 text-sm">Post a ride request and let drivers find you.</p>
            </div>
            <a href="/create-ride.html" class="btn btn-accent px-8 py-4 w-full md:w-auto">
                Request a Ride
            </a>
        </div>
    </div>

    <script type="module">
        import { utils } from '/js/utils.js';
        import { rides } from '/js/rides.js';
        
        utils.requireAuth();
        lucide.createIcons();

        const ridesList = document.getElementById('ridesList');

        async function loadRides() {
            const data = await rides.getAvailable();
            renderRides(data);
        }

        function renderRides(rideList) {
            if (!rideList || rideList.length === 0) {
                ridesList.innerHTML = `
                    <div class="card p-20 text-center flex flex-col items-center">
                        <div class="w-20 h-20 bg-muted rounded-full flex items-center justify-center mb-6 text-gray-300">
                            <i data-lucide="frown" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-2xl font-black mb-2">No rides found</h2>
                        <p class="text-gray-500">Try searching for a different destination or check back later.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            ridesList.innerHTML = rideList.map(ride => `
                <div class="card p-6 flex flex-col md:flex-row md:items-center justify-between gap-6 hover:border-black group transition-all">
                    <div class="flex-1 flex gap-8">
                        <div class="flex flex-col items-center justify-center bg-canvas rounded-xl px-4 py-2">
                            <span class="text-[10px] font-black uppercase text-text-dim tracking-widest">Time</span>
                            <span class="text-xl font-bold">${ride.time || '14:20'}</span>
                        </div>
                        <div class="flex flex-col justify-center">
                            <div class="flex items-center gap-3 mb-1">
                                <span class="font-bold text-base uppercase tracking-tight">${ride.start_location}</span>
                                <i data-lucide="arrow-right" class="w-3 h-3 text-text-dim"></i>
                                <span class="font-bold text-base uppercase tracking-tight">${ride.end_location}</span>
                            </div>
                            <div class="text-xs text-text-dim font-medium uppercase tracking-wider">
                                Today • 5.2 km away
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between md:justify-end gap-10">
                        <div class="text-center">
                            <div class="text-2xl font-black">${ride.seats}</div>
                            <div class="text-[10px] uppercase text-text-dim font-bold tracking-tighter">Seats Left</div>
                        </div>
                        <button onclick="handleJoin('${ride.id}')" class="btn btn-primary px-8 group-hover:bg-accent group-hover:text-black group-hover:border-accent transition-all">
                            Join Journey
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.handleJoin = async (id) => {
            const success = await rides.join(id);
            if (success) {
                setTimeout(() => {
                    window.location.href = "/dashboard.html";
                }, 1500);
            }
        };

        loadRides();
    </script>
</body>
</html>
