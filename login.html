<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CabShare</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-canvas min-h-screen flex items-center justify-center p-6 text-black">
    <div class="w-full max-w-md animate-fade-in">
        <a href="/index.html" class="inline-flex items-center gap-2 text-text-dim hover:text-black mb-8 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Home
        </a>

        <div class="card p-10">
            <h2 class="text-3xl font-extrabold mb-1 tracking-tight">Welcome Back</h2>
            <p class="text-text-dim mb-8">Enter your details to login.</p>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full py-4 text-base">
                    Sign In
                </button>
            </form>

            <p class="mt-8 text-center text-text-dim text-sm">
                Don't have an account? 
                <a href="/register.html" class="text-black font-bold hover:underline">Register here</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { auth } from '/js/auth.js';
        
        lucide.createIcons();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await auth.login(email, password);
        });
    </script>
</body>
</html>
