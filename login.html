<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CabShare</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-canvas min-h-screen flex items-center justify-center p-6 text-black">
    <div class="w-full max-w-md animate-fade-in">
        <a href="index.html" class="inline-flex items-center gap-2 text-text-dim hover:text-black mb-8 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Home
        </a>

        <div class="card p-10">
            <h2 class="text-3xl font-extrabold mb-1 tracking-tight">Welcome Back</h2>
            <p class="text-text-dim mb-8">Enter your details to login.</p>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full py-4 text-base">
                    Sign In
                </button>
            </form>

            <p class="mt-8 text-center text-text-dim text-sm">
                Don't have an account? 
                <a href="register.html" class="text-black font-bold hover:underline">Register here</a>
            </p>
        </div>
    </div>

   
    <script type="module">

    lucide.createIcons();

    const loginForm =
        document.getElementById("loginForm");

    loginForm.addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/auth/login/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );

                const data = await response.json();

                console.log(data);

                if (response.ok) {

                    localStorage.setItem(
                        "accessToken",
                        data.access
                    );

                    localStorage.setItem(
                        "refreshToken",
                        data.refresh
                    );

                    alert("Login Successful!");

                    window.location.href =
                        "dashboard.html";

                } else {

                    alert(JSON.stringify(data));
                }

            } catch (error) {

                console.log(error);

                alert("Server Error");
            }
        }
    );

</script>
</body>
</html>
